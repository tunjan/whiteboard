services:
  - type: web
    name: whiteboard
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run db:push && npm start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: whiteboard-db
          property: connectionString
      - key: TUTOR_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: TUTOR_NAME
        value: Tutor
      - key: BLOB_DIR
        value: /var/data/blobs
    disk:
      name: whiteboard-uploads
      mountPath: /var/data
      sizeGB: 1

databases:
  - name: whiteboard-db
    plan: starter
