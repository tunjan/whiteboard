services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: whiteboard
      POSTGRES_PASSWORD: whiteboard
      POSTGRES_DB: whiteboard
    ports:
      # Host port 5433 to avoid clashing with other local Postgres instances.
      - '5433:5432'
    volumes:
      - whiteboard_pg:/var/lib/postgresql/data

  # The production image, run locally: `docker compose --profile app up --build`.
  # Behind a profile so `npm run db:up` still starts Postgres alone.
  app:
    profiles: [app]
    build: .
    restart: unless-stopped
    depends_on: [postgres]
    env_file: server/.env
    environment:
      DATABASE_URL: postgres://whiteboard:whiteboard@postgres:5432/whiteboard
    ports:
      - '3001:3001'
    volumes:
      - whiteboard_data:/app/server/data
    # Room for the shutdown drain (15s) before Docker sends SIGKILL.
    stop_grace_period: 30s

  # The way in from the internet for a hosted server, without opening a port:
  # a Cloudflare tunnel whose public hostname points at http://app:3001. Make
  # the tunnel in the Cloudflare dashboard, put its token in TUNNEL_TOKEN (in a
  # `.env` beside this file) and run `docker compose --profile app --profile tunnel up -d`.
  tunnel:
    profiles: [tunnel]
    image: cloudflare/cloudflared:2025.10.0
    restart: unless-stopped
    depends_on: [app]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}

volumes:
  whiteboard_pg:
  whiteboard_data:
